{% extends "base.html" %}

{% block content %}

<div class="section-header">
  <h2 class="section-title">
    {{ career.title }}
  </h2>
  <a
    href="/careers-page"
    class="btn-back view-all-btn-pc"
  >
    ← 職務経歴一覧へ戻る
  </a>  
</div>

<article class="detail-card">
  <h1>{{ career.title }}</h1>

  <p class="work-meta">{{ career.period }}</p>

  <div class="content">
    <p>{{ career.description }}</p>
  </div>

  {% if career.technologies %}
    <div class="tech-tags">
      {% for tech in career.technologies.split(",") %}
        <span class="tech-tag">{{ tech.strip() }}</span>
      {% endfor %}
    </div>
  {% endif %}
</article>

<nav class="section-footer">
  <a
    href="/careers-page"
    class="btn-back view-all-btn-sp"
  >
    ← 職務経歴一覧へ戻る
  </a>

{% endblock %}
