{% extends "base.html" %}

{% block content %}

{% set breadcrumbs = [
  {"name": "ホーム", "url": "/"},
  {"name": "職務経歴", "url": "/careers-page"},
  {"name": ""}
] %}

{% include "components/breadcrumb.html" %}

<div class="section-header">
  <h2 class="section-title">
    {{ career.title }} を編集 
  </h2>
</div>

<form
  action="/careers-page/{{ career.id }}/edit"
  method="post"
  class="form-card"
>
  <div class="form-group">
    <label>タイトル</label>

    <input
      class="form-input"
      type="text"
      name="title"
      value="{{ career.title }}"
    >
  </div>

  <div class="form-group">
    <label>会社名</label>

    <input
      class="form-input"
      type="text"
      name="company"
      value="{{ career.company }}"
    >
  </div>

  <div class="form-group">
    <label>開始日</label>

    <input
      class="form-input"
      type="date"
      name="start_date"
      value="{{ career.start_date.strftime('%Y-%m-%d') if career and career.start_date else '' }}"
    >
  </div>

  <div class="form-group">
    <label>終了日</label>

    <input
      class="form-input"
      type="date"
      name="end_date"
      value="{{ career.end_date.strftime('%Y-%m-%d') if career and career.end_date else '' }}"
    >
  </div>

  <div class="form-group">
    <label>説明</label>

    <textarea
      class="form-textarea"
      name="description"
    >{{ career.description }}</textarea>
  </div>

  <div class="form-group">
    <label>使用技術（カンマ区切り）</label>

    <input
      class="form-input"
      type="text"
      name="tech_stack"
      value="{{ career.technologies }}"
    >
  </div>

  <button
    type="submit"
    class="primary-button"
  >
    更新する
  </button>
</form>

<nav class="section-footer">
  <a
    href="/careers-page/{{ career.id }}"
    class="btn-back view-all-btn-sp"
  >
    職務経歴詳細へ戻る
  </a>
</nav>

{% endblock %}
