{% extends "base.html" %}

{% block content %}

<div class="page-header">
  <div>
    <h1 class="section-title">
      {{ blog.title }}
    </h1>
  </div>

  <a href="/blogs-page" class="btn-back">
    ← 技術ブログ一覧へ戻る
  </a>
</div>

<section class="work-hero">
  <div class="work-hero-content">

    <div class="blog-meta">
      {% if blog.created_at %}
        <span>投稿日：{{ blog.created_at }}</span>
      {% endif %}
    </div>

    <div class="blog-content">
      {{ blog.content | safe }}
    </div>

    <div class="work-actions">
      {% if is_logged_in %}
        <a
          href="/blogs-page/{{ blog.id }}/edit"
          class="btn-outline"
        >
          技術ブログを編集する
        </a>

        <form
          action="/blogs-page/{{ blog.id }}/delete"
          method="post"
        >
          <button type="submit" class="btn-danger">
            技術ブログを削除する
          </button>
        </form>
      {% endif %}
    </div>

  </div>
</section>

{% endblock %}
