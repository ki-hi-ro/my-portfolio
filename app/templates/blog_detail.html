{% extends "base.html" %}

{% block content %}

<div class="blog-detail-header">

  <a href="/blogs-page" class="btn-back mobile-only">
    ← 戻る
  </a>

  <h1 class="blog-detail-title">
    {{ blog.title }}
  </h1>

  <a href="/blogs-page" class="btn-back desktop-only">
    ← 戻る
  </a>

</div>

<section class="blog-detail">
  <div class="blog-detail-content">

    <div class="blog-meta">
      {% if blog.created_at %}
        <span>投稿日：{{ blog.created_at.strftime('%Y.%m.%d') }}</span>
      {% endif %}
    </div>

    <div class="blog-content">
      {{ blog.content | safe }}
    </div>

    {% if blog.tags %}
      <div class="tech-tags">
        {% for tag in blog.tags.split(",") %}
          <span class="tech-tag">
            {{ tag.strip() }}
          </span>
        {% endfor %}
      </div>
    {% endif %}

  </div>
</section>

{% endblock %}
