{% extends "base.html" %}

{% block content %}
<section class="top-section">
  <div class="section-header">
    <h1 class="section-title">
      技術ブログ
    </h1>

    <nav>
      <a href="/blogs/new">
        記事を追加
      </a>
    </nav>
  </div>

  <div class="work-grid">
    {% for blog in blogs %}
      <a
        href="{{ blog.url }}"
        target="_blank"
        class="work-card"
      >
        <h2>
          {{ blog.title }}
        </h2>

        {% if blog.summary %}
          <p class="work-description">
            {{ blog.summary }}
          </p>
        {% endif %}

        {% if blog.tags %}
          <div class="tech-tags">
            {% for tag in blog.tags.split(",") %}
              <span class="tech-tag">
                {{ tag.strip() }}
              </span>
            {% endfor %}
          </div>
        {% endif %}

        <span class="text-link">
          記事を読む
        </span>
      </a>
    {% endfor %}
  </div>
</section>
{% endblock %}
