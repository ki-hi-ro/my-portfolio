{% extends "base.html" %}

{% block content %}

<div class="section-header">
    <h2 class="section-title">
        職務経歴一覧
    </h2>

    <nav>
        {% if is_logged_in %}
        <a href="/careers-page/new">
            職務経歴を登録する
        </a>
        {% endif %}
    </nav>
</div>

<div class="top-grid">
    {% for career in careers %}
    <a
        href="/careers-page/{{ career.id }}"
        class="career-card"
    >
        <h2>{{ career.title }}</h2>

        <div class="blog-meta">
            {% if career.period %}
            <span>{{ career.period }}</span>
            {% endif %}
        </div>

        <p>{{ career.description[:120] }}...</p>
    </a>
    {% endfor %}
</div>

{% endblock %}
