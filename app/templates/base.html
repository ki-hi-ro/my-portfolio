<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>My Portfolio</title>
  <link rel="stylesheet" href="/static/style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
  <header class="site-header">
    <div class="site-header-top">
      <h1 class="site-title">
        <a href="/">My Portfolio</a>
      </h1>

      {% if is_logged_in %}
      <a
        href="/logout"
        class="login-link"
      >
        ログアウト
      </a>
      {% else %}
      <a
        href="/login"
        class="login-link"
      >
        ログイン
      </a>
      {% endif %}
    </div>

    <p class="site-description">
      <a href="/#works">制作物</a>・<a href="/#blogs">技術ブログ</a>・<a href="/#careers">職務経歴</a>
      をまとめたポートフォリオサイトです。
    </p>

    <hr>
  </header>

  <main>
    {% block content %}
    {% endblock %}
  </main>

  <button id="page-top" class="page-top">
    <span>↑</span>
  </button> 
  <script src="/static/main.js"></script>
</body>
</html>
