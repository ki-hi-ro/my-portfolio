<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>{% if page_title %}{{ page_title }}{% elif is_home %}柴田浩貴｜フリーランスWeb開発者{% else %}My Portfolio{% endif %}</title>
  <meta name="description" content="Python・FastAPI・WordPressを中心に、Webアプリ開発、業務効率化、Web制作に対応するフリーランスWeb開発者・柴田浩貴のポートフォリオです。">
  <link rel="icon" type="image/jpeg" href="/static/images/portfolio-hero-workspace.png">
  <link rel="stylesheet" href="/static/style.css?v=2.1.3">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body class="{% if is_home or is_record_detail %}home-page design-1{% else %}subpage-body design-1{% endif %}">
  {% if not is_home and not is_record_detail %}
  <header class="portfolio-nav partner-nav subpage-nav">
    <a href="/" class="brand-mark" aria-label="ホーム"><span>H</span> HIROKI SHIBATA</a>
    <nav aria-label="メインナビゲーション">
      <a href="/works-page">制作物</a>
      <a href="/blogs-page">技術ブログ</a>
      <a href="/careers-page">職務経歴</a>
    </nav>
    <div class="nav-actions">
    {% if is_logged_in %}
      <a href="/logout" class="nav-cta">ログアウト <span>↗</span></a>
    {% endif %}
    </div>
  </header>
  {% endif %}

  <main{% if not is_home and not is_record_detail %} class="subpage-main"{% endif %}>
    {% block content %}
    {% endblock %}
  </main>

  <button id="page-top" class="page-top">
    <span>⇧</span>
  </button> 
  <script src="/static/main.js?v=1.0.3"></script>
</body>
</html>
